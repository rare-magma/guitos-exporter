name: Create and publish a container image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
      packages: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Authenticate to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | buildah login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin --compat-auth-file=/home/runner/.docker/config.json

      - name: Build and push image
        id: build-push
        run: |
          set -euo pipefail

          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cosign

          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          buildah build \
            --jobs 2 \
            --platform=linux/arm64,linux/amd64 \
            --manifest "${IMAGE}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.created="${CREATED}" \
            .

          buildah push "${IMAGE}"
          buildah manifest push --all "${IMAGE}" "docker://${IMAGE}"
          DIGEST="$(skopeo inspect docker://${IMAGE} | jq -r .Digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          cosign sign --recursive --yes "${IMAGE}@${DIGEST}"

      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
